  description: Compare IFC storey count with the selected mock parcel's permit record.
  severity: CRITICAL
  check_type: storey_count
  parameters:
    limit_source: mock_parcel_record
  source_document: County parcel permit record (mock)
  clause_reference: null # TODO: add a verified clause citation
  last_reviewed: "2026-11-05"
