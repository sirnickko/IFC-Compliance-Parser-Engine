# Rule definitions with provenance metadata
# Each entry corresponds to a rule used by the compliance engine.
# Fields: id, name, description, severity, check_type, parameters, source_document, clause_reference, last_reviewed, status

- id: ERR_STOREY_EXCEEDED
  name: "Storey Limit Exceeded"
  description: "The building exceeds the permitted number of storeys for the parcel."
  severity: "CRITICAL"
  check_type: "rule"
  parameters:
    max_permitted_storeys: null  # Filled at runtime from parcel data
  source_document: "Kenyan County Planning Regulation"
  clause_reference: "Section 4.2.1"
  last_reviewed: "2024-06-15"
  status: "verified"

- id: ERR_UNDERSIZED_COLUMN
  name: "Undersized Column Detected"
  description: "Column cross‑section area is below the minimum required for its load path."
  severity: "CRITICAL"
  check_type: "rule"
  parameters:
    min_area_mm2: 1500
  source_document: "Kenyan Structural Code KS‑04‑245"
  clause_reference: "Clause 5.3"
  last_reviewed: "2023-12-02"
  status: "verified"

- id: WARN_UNDERSIZED_COLUMN
  name: "Column Below Recommended Size"
  description: "Column cross‑section area is below the recommended size but still passes minimum code."
  severity: "WARNING"
  check_type: "rule"
  parameters:
    recommended_area_mm2: 2000
  source_document: "Kenyan Structural Code KS‑04‑245"
  clause_reference: "Clause 5.3"
  last_reviewed: "2023-12-02"
  status: "verified"

- id: ERR_MISSING_VERTICAL_EGRESS
  name: "Missing Vertical Egress"
  description: "No adequate vertical egress paths (stairs or fire escapes) are present on the required storeys."
  severity: "CRITICAL"
  check_type: "rule"
  parameters: {}
  source_document: "Physical and Land Use Planning Act, 2019"
  clause_reference: "Section 8.5"
  last_reviewed: "2024-01-10"
  status: "verified"

